services:
  spark:
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: streamforge-spark
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ecommerce-events
      CHECKPOINT_LOCATION: /opt/spark-checkpoints/streamforge
      JDBC_URL: jdbc:postgresql://postgres:5432/streamforge
      DB_USER: streamforge
      DB_PASSWORD: streamforge_dev
    volumes:
      - spark_checkpoints:/opt/spark-checkpoints
    restart: unless-stopped

volumes:
  spark_checkpoints: